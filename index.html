<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PakPal | Fasilitator &amp; Trainer</title>
<meta name="description" content="Paljariati Yusral (PakPal): fasilitator, trainer, dan coach sejak 2001; sejak 2023 fokus pada literasi AI dan desain pembelajaran. Berbagi ilmu, menginspirasi, memberdayakan.">
<meta name="theme-color" content="#FAF8F3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F3;
  --bg-2:#F2EEE3;
  --indigo:#2E2A63;
  --ink:#211E45;
  --muted:#6B688A;
  --accent:#8A6414;
  --accent-deep:#B58A34;
  --gold-light:#E2B457;
  --line:#E4E0D4;
  --card:#ffffff;
  --radius:15px;
  --display:"Fraunces",Georgia,serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--indigo);outline-offset:3px;border-radius:8px}

/* ---------- Latar ---------- */
.stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg)}
.stage::after{content:"";position:absolute;width:50vmax;height:50vmax;left:-20vmax;bottom:-24vmax;border-radius:50%;background:radial-gradient(circle,rgba(181,138,52,.10) 0%,transparent 65%)}

/* ---------- Kerangka ---------- */
.app{position:relative;z-index:1;height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
header,main{width:100%;max-width:1200px;margin-inline:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 20px 10px;border-bottom:1px solid var(--line);background:rgba(250,248,243,.92)}
.brand{display:flex;align-items:center;gap:10px}
.brand__mark{width:14px;height:14px;background:var(--accent-deep);transform:rotate(45deg);border-radius:2px;flex:none}
.brand__name{font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:.01em;color:var(--indigo)}
.cta{display:inline-flex;align-items:center;min-height:44px;padding:0 22px;border-radius:999px;background:var(--indigo);color:#fff;font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(46,42,99,.25);transition:transform .15s,filter .15s}
.cta:hover{filter:brightness(1.15);transform:translateY(-1px)}

/* ---------- Konten ---------- */
main{overflow-y:auto;overflow-x:hidden;padding:6px 0 14px;display:grid;align-content:start;gap:16px;
  grid-template-areas:"portrait" "intro" "rail"}
.portrait{grid-area:portrait;justify-self:center;height:clamp(150px,27dvh,300px);aspect-ratio:4/5;position:relative;
  border-radius:26px;overflow:hidden;border:3px solid #fff;
  box-shadow:0 0 0 2px var(--accent-deep),0 20px 44px rgba(46,42,99,.25)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}

.intro{grid-area:intro;padding:0 20px}
.pill{display:inline-block;padding:8px 16px;border-radius:999px;border:1px solid var(--accent-deep);background:#fff;color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
h1{margin-top:12px;font-family:var(--display);font-weight:800;font-size:clamp(2.3rem,10.5vw,4.8rem);line-height:1;color:var(--indigo);letter-spacing:-.01em}
.sub{display:block;margin-top:8px;font-family:var(--body);font-weight:700;font-size:clamp(1.1rem,5vw,1.9rem);line-height:1.15;color:var(--accent);letter-spacing:0}
.desc{margin-top:14px;font-size:clamp(1rem,4vw,1.2rem);line-height:1.5;max-width:34em}
.socials{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--indigo);font-size:13px;font-weight:700;transition:border-color .15s,color .15s}
.chip:hover{border-color:var(--accent-deep);color:var(--accent)}
.swap{animation:swapIn .45s ease both}
@keyframes swapIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Carousel ---------- */
.rail{grid-area:rail;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.track{display:flex;width:max-content;animation:scroll var(--dur,60s) linear infinite}
.rail:hover .track,.rail.is-paused .track,.rail:focus-within .track{animation-play-state:paused}
@keyframes scroll{to{transform:translateX(-50%)}}
.rail--manual{overflow-x:auto;scroll-snap-type:x proximity;-webkit-mask-image:none;mask-image:none;padding:0 20px}
.rail--manual .track{animation:none}
.rail--manual .card{scroll-snap-align:start}

.card{flex:none;margin-right:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:0 6px 18px rgba(46,42,99,.08)}
.card--sm{display:flex;align-items:center;gap:14px;padding:14px 20px 14px 14px;min-width:200px;max-width:300px}
.card__icon{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(181,138,52,.14);color:var(--accent)}
.card__icon svg{width:22px;height:22px}
.card__label{display:block;font-size:12px;color:var(--muted);font-weight:600}
.card__value{display:block;margin-top:2px;font-size:15px;font-weight:700;line-height:1.3}
.card--lg{width:min(300px,78vw);padding:18px;display:flex;flex-direction:column;gap:8px;min-height:150px;transition:transform .15s,border-color .15s}
a.card--lg:hover{transform:translateY(-3px);border-color:var(--accent-deep)}
.tag{align-self:flex-start;padding:3px 10px;border-radius:999px;background:rgba(181,138,52,.14);color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.card--lg h3{font-family:var(--display);font-weight:700;color:var(--indigo);font-size:1.25rem;line-height:1.2;white-space:normal}
.card--lg p{font-size:14px;line-height:1.45;color:var(--muted);white-space:normal}
.card--lg .go{margin-top:auto;font-size:13px;font-weight:700;color:var(--accent)}

/* ---------- Menu bawah ---------- */
nav{padding:0 10px calc(10px + env(safe-area-inset-bottom));background:var(--indigo);box-shadow:0 -6px 24px rgba(46,42,99,.18)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:640px;margin:0 auto;padding-top:8px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:58px;padding:8px 2px;border-radius:14px;color:#E6E3F5;font-size:12.5px;font-weight:600;transition:background .2s,color .2s}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{background:rgba(226,180,87,.16);color:var(--gold-light)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:-9px;left:50%;width:44%;height:3px;transform:translateX(-50%);border-radius:0 0 3px 3px;background:var(--gold-light)}
nav :focus-visible{outline-color:var(--gold-light)}

/* ---------- Desktop ---------- */
@media (min-width:900px){
  main{grid-template-columns:1.1fr .9fr;grid-template-areas:"intro portrait" "rail rail";align-content:center;gap:28px 40px;padding:10px 0 24px}
  .intro{align-self:center;padding:0 20px 0 40px}
  .portrait{height:min(52dvh,460px);justify-self:start}
  header{padding-left:40px;padding-right:40px}
  .rail--manual{padding:0 40px}
}
@media (max-height:640px) and (max-width:899px){.portrait{height:120px}}
@media (prefers-reduced-motion:reduce){
  .swap{animation:none}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:899px){
  .chip{min-height:34px;padding:0 13px;font-size:12px}
  .socials{gap:6px;margin-top:12px}
  .card--lg{min-height:128px;padding:16px}
  main{padding-bottom:18px}
}
.rail{min-height:max-content}
</style>
</head>

/* ===================== Mesin tampilan ===================== */
const $ = s => document.querySelector(s);
const order = Object.keys(DATA);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const waLink = txt => `https://wa.me/${SITE.whatsapp}?text=${encodeURIComponent(txt)}`;
$("#cta").href = waLink(SITE.waMessage);

// bangun menu tab
const SOCIAL_LABEL = {instagram:"Instagram",tiktok:"TikTok",youtube:"YouTube",facebook:"Facebook",linkedin:"LinkedIn",threads:"Threads",x:"X",telegram:"Telegram",website:"Website",email:"Email"};
(function () {
  const attr = s => String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
  const box = $("#socials");
  const chips = Object.keys(SOCIAL_LABEL).map(k => {
    let v = String(SOCIAL[k] || "").trim(); if (!v) return "";
    if (k === "email" && !/^mailto:/.test(v)) v = "mailto:" + v;
    if (!/^(https?:|mailto:)/.test(v)) return "";
    return `<a class="chip" href="${attr(v)}" target="_blank" rel="noopener noreferrer">${SOCIAL_LABEL[k]}</a>`;
  }).join("");
  if (chips) box.innerHTML = chips; else box.remove();
})();

const tabsEl = $("#tabs");
order.forEach(k => {
  const b = document.createElement("button");
  b.type="button"; b.className="tab"; b.id="tab-"+k; b.setAttribute("role","tab"); b.dataset.key=k;
  b.setAttribute("aria-controls","panel");
  b.innerHTML = svg(DATA[k].icon) + `<span>${DATA[k].label}</span>`;
  b.addEventListener("click", () => show(k));
  tabsEl.appendChild(b);
});
tabsEl.addEventListener("keydown", e => {
  const i = order.indexOf(current);
  let n = null;
  if (e.key==="ArrowRight") n = order[(i+1)%order.length];
  if (e.key==="ArrowLeft") n = order[(i-1+order.length)%order.length];
  if (n){ e.preventDefault(); show(n); $("#tab-"+n).focus(); }
});

const cardHTML = (d, c) => {
  if (Array.isArray(c))
    return `<div class="card card--sm"><span class="card__icon">${svg(c[0])}</span><span><span class="card__label">${c[1]}</span><span class="card__value">${c[2]}</span></span></div>`;
  const inner = `<span class="tag">${c.tag}</span><h3>${c.title}</h3><p>${c.meta}</p>`;
  if (d.order || c.wa) {
    const href = waLink(`Assalamu'alaikum Pak Pal 👋 Saya tertarik dengan ${c.title}. Boleh dijelaskan lebih lanjut?`);
    return `<a class="card card--lg" href="${href}" target="_blank" rel="noopener noreferrer">${inner}<span class="go">Tanya via WhatsApp →</span></a>`;
  }
  return `<div class="card card--lg">${inner}</div>`;
};

let current = null;
function show(key, push=true){
  if (!DATA[key]) key = "profil";
  current = key;
  const d = DATA[key];
  order.forEach(k => {
    const b = $("#tab-"+k), on = k===key;
    b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1;
  });
  $("#panel").setAttribute("aria-labelledby","tab-"+key);
  $("#pill").textContent = d.pill;
  $("#title").innerHTML = `${d.title}<span class="sub">${d.sub}</span>`;
  $("#desc").textContent = d.desc;
  const intro = $("#intro"); intro.classList.remove("swap"); void intro.offsetWidth; intro.classList.add("swap");

  const rail = $("#rail"), track = $("#track");
  const items = d.cards.map(c => cardHTML(d, c)).join("");
  rail.classList.toggle("rail--manual", reduce);
  rail.classList.remove("is-paused");
  if (reduce) { track.innerHTML = items; track.style.removeProperty("--dur"); }
  else {
    track.innerHTML = items + `<div aria-hidden="true" style="display:contents">${items.replace(/href="[^"]*"/g,'href="#" tabindex="-1"')}</div>`;
    requestAnimationFrame(() => track.style.setProperty("--dur", Math.max(25, (track.scrollWidth/2)/42) + "s"));
  }
  $("#panel").scrollTop = 0;
  if (push) history.replaceState(null,"","#"+key);
  requestAnimationFrame(fit);
}

// jeda saat disentuh
const rail = $("#rail"); let t;
rail.addEventListener("pointerdown", () => { clearTimeout(t); rail.classList.add("is-paused"); });
["pointerup","pointercancel"].forEach(ev => rail.addEventListener(ev, () => { t = setTimeout(()=>rail.classList.remove("is-paused"), 2500); }));

/* Muat pas di layar HP: foto menyusut otomatis sampai carousel tidak tertutup menu bawah */
function fit() {
  const p = document.querySelector(".portrait"), m = $("#panel");
  if (matchMedia("(min-width:900px)").matches) { p.style.height = ""; return; }
  let h = Math.min(300, Math.round(innerHeight * 0.27));
  p.style.height = h + "px";
  while (m.scrollHeight > m.clientHeight + 1 && h > 96) { h -= 6; p.style.height = h + "px"; }
}
addEventListener("resize", fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
addEventListener("hashchange", () => show(location.hash.slice(1), false));
show(location.hash.slice(1) || "profil", false);
